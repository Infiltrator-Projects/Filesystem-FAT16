name: Qualify and publish independent FAT16 module
on:
  push:
    branches: [main, migration/full-source-fat16-20261028]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: filesystem-fat16-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install build and inspection prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential binutils python3 dpkg-dev cmake dosfstools mtools
      - name: Check out the unchanged Defragmenter consumer and its pinned Common
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: Infiltrator-Projects/Defragmenter
          ref: d54c91993f4945e7a348410d26567c50554ac356
          submodules: recursive
          path: .qualification/Defragmenter
      - name: Compile and exercise exactly one shared object
        run: make check
      - name: Preserve filesystem lifecycle and Defragmenter write/recovery compatibility
        run: |
          bash tests/check-fat16-lifecycle.sh build/FAT16.so
          python3 tests/fat16_complete_test.py --module build/FAT16.so
          python3 tests/boot_defrag_compat.py --module build/FAT16.so \
            --defragmenter-source .qualification/Defragmenter --output build/defrag-compat
      - name: Build the DEB and native source installer
        run: make release
      - name: Validate release bytes and native installation
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
          bash dist/*.run --help
          sudo bash dist/*.run --profile aggressive --system-package-mode
          version=$(cat VERSION)
          test "$(dpkg-query -W -f='${Version}' infiltrator-filesystem-fat16)" = "${version}+native1"
          python3 standalone/build.py --profile portable --output build/FAT16.so --check
          bash tests/check-fat16-lifecycle.sh /System/Filesystems/FAT16.so
          python3 tests/fat16_complete_test.py --module /System/Filesystems/FAT16.so
          python3 tests/boot_defrag_compat.py --module /System/Filesystems/FAT16.so \
            --defragmenter-source .qualification/Defragmenter --output build/native-compat
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          lib = Path("/System/Filesystems/FAT16.so")
          import os
          import subprocess
          docs = Path("/System/Resources/Documentation/Filesystem-FAT16")
          manual = docs / "FAT16.pdf"
          assert manual.read_bytes().startswith(b"%PDF-")
          assert {p.name for p in docs.iterdir()} == {manual.name}
          report = subprocess.check_output(["dpkg-query", "-s", "infiltrator-filesystem-fat16"], text=True)
          fields = dict(line.split(": ", 1) for line in report.splitlines() if ": " in line)
          assert fields["X-Infiltrator-Native-Profile"] == "aggressive"
          assert fields["X-Infiltrator-PGO"] == "trained-two-pass"
          assert fields["X-Infiltrator-LTO"] == "enabled"
          assert fields["X-Infiltrator-Source-Revision"] == os.environ["GITHUB_SHA"]
          assert "-O3 -march=native -mtune=native -flto=auto" in fields["X-Infiltrator-Cflags"]
          assert fields["X-Infiltrator-Resource-SHA256"] == hashlib.sha256(lib.read_bytes()).hexdigest()
          assert fields["X-Infiltrator-PDF-SHA256"] == hashlib.sha256(manual.read_bytes()).hexdigest()
          assert not Path("/System/Filesystems/FAT12.so").exists()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fat16-qualified-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  boot-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check out the released Boot consumer
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: Infiltrator-Projects/Boot
          ref: dbc6a710dbe88b78318c8b9afbf47bb64e8706b3
          path: .qualification/Boot
      - name: Install firmware integration prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential binutils python3 gnu-efi qemu-system-x86 ovmf dosfstools mtools busybox-static cpio
      - name: Build the actual released Boot EFI application
        working-directory: .qualification/Boot
        run: bash scripts/build-gnuefi.sh
      - name: Qualify portable and native filesystem bytes with Boot
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE"
          boot="$root/.qualification/Boot"
          make check
          python3 standalone/build.py --profile aggressive --output build-native/FAT16.so --check
          for profile in build build-native; do
            bash "$boot/tests/run-so-tests.sh" "$root/$profile/FAT16.so" "$root"
          done
          IFS_SO_SANITIZE=1 bash "$boot/tests/run-so-tests.sh" "$root/build/FAT16.so" "$root"
          kernel_dir="$root/build/boot-kernel"
          mkdir -p "$kernel_dir"
          kernel_package=$(apt-cache depends linux-image-generic | awk '/Depends: linux-image-[0-9]/ {sub("linux-image-", "linux-image-unsigned-", $2); print $2; exit}')
          test -n "$kernel_package"
          (cd "$kernel_dir" && apt-get download "$kernel_package")
          dpkg-deb -x "$kernel_dir"/*.deb "$kernel_dir/root"
          kernel=$(find "$kernel_dir/root/boot" -name 'vmlinuz-*' -print -quit)
          test -s "$kernel"
          for profile in build build-native; do
            python3 "$boot/tests/test_so_boot.py" --boot "$boot/refind/refind_x64.efi" \
              --module "$root/$profile/FAT16.so" --kernel "$kernel" \
              --ovmf /usr/share/OVMF --qemu-data /usr/share/qemu --output "$root/build/boot-$profile"
          done
          python3 "$boot/tests/test_so_boot.py" --boot "$boot/refind/refind_x64.efi" \
            --module "$root/build/FAT16.so" --kernel "$kernel" --reject-module \
            --ovmf /usr/share/OVMF --qemu-data /usr/share/qemu --output "$root/build/boot-reject"
      - name: Preserve firmware integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fat16-boot-consumer-${{ github.sha }}
          path: |
            build/boot-build/*.log
            build/boot-build-native/*.log
            build/boot-reject/*.log
  native-drivers:
    uses: ./.github/workflows/drivers.yml
  publish:
    needs: [qualify, boot-consumer, native-drivers]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fat16-qualified-${{ github.sha }}
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: fat12-fat16-efi-experimental
          path: build/native
      - uses: actions/download-artifact@v4
        with:
          name: fat12-fat16-ko-6.12.107-qemu-only
          path: build/native
      - name: Publish exact qualified release once
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/main | cut -f1)"
          version=$(cat VERSION)
          tag="v${version}"
          test -s build/native/FAT16.efi
          test -s build/native/fat16.ko
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Immutable $tag already exists; no release update required."
            exit 0
          fi
          install -m 0644 "build/native/FAT16.efi" "dist/FAT16.efi"
          install -m 0644 "build/native/fat16.ko" "dist/fat16-linux-6.12.107.ko"
          sha256sum dist/*.deb dist/*.run dist/*.efi dist/*.ko
          gh release create "$tag" dist/*.deb dist/*.run dist/*.efi dist/*.ko \
            --target "$GITHUB_SHA" --title "Filesystem FAT16 ${version}" \
            --notes "Independent FAT16.so portable package and source-first native RUN; FAT16.efi is independently OVMF-tested for x86-64 boot services; fat16-linux-6.12.107.ko is QEMU-tested for ONLY that pinned Linux 6.12.107 kernel and compatible FAT core, and must be rebuilt for any other host kernel. Physical-drive safety, arbitrary-root boot, and generic signed kernel installation are NOT certified."
