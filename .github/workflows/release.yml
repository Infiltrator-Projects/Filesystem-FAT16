name: Qualify and publish independent FAT16 module
on:
  push:
    branches: [main, migration/full-source-fat16-20261028]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: filesystem-fat16-${{ github.ref }}
  cancel-in-progress: false
jobs:
  driver-runtime:
    uses: ./.github/workflows/driver-runtime.yml
    permissions:
      contents: read
  qualify:
    needs: driver-runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install build and inspection prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential binutils kmod python3 dpkg-dev
      - name: Retrieve QEMU-qualified kernel modules
        uses: actions/download-artifact@v4
        with:
          name: fat12-fat16-ko-6.12.107-qemu-only
          path: standalone/qualified-drivers
      - name: Retrieve OVMF-qualified EFI drivers
        uses: actions/download-artifact@v4
        with:
          name: fat12-fat16-efi-experimental
          path: standalone/qualified-drivers
      - name: Keep exactly this repository's drivers
        run: |
          set -euo pipefail
          test -s standalone/qualified-drivers/fat16.ko
          test -s standalone/qualified-drivers/FAT16.efi
          rm -f standalone/qualified-drivers/fat12.ko standalone/qualified-drivers/FAT12.efi
      - name: Compile and exercise exactly one shared object
        run: make check
      - name: Build the DEB and native source installer
        run: make release
      - name: Validate release bytes and native installation
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
          python3 standalone/verify_drivers.py dist/*.deb
          bash dist/*.run --help
          sudo --preserve-env=GITHUB_ACTIONS bash dist/*.run --profile aggressive --system-package-mode --ci-reference-kernel-only
          version=$(cat VERSION)
          test "$(dpkg-query -W -f='${Version}' infiltrator-filesystem-fat16)" = "${version}+native1"
          python3 standalone/build.py --profile portable --output build/FAT16.so --check
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          lib = Path("/System/Filesystems/FAT16.so")
          info = Path("/System/Resources/Documentation/Filesystem-FAT16/BUILD-INFO").read_text()
          assert "Profile: aggressive\n" in info
          assert "-O3 -march=native -mtune=native -flto=auto" in info
          assert f"SHA256: {hashlib.sha256(lib.read_bytes()).hexdigest()}\n" in info
          assert not Path("/System/Filesystems/FAT12.so").exists()
          assert Path("/System/Kernel/Modules/6.12.107-qemu-tested-only/fat16.ko").is_file()
          assert Path("/System/Kernel/Firmware/EFI/FAT16.efi").is_file()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fat16-qualified-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: qualify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fat16-qualified-${{ github.sha }}
          path: dist
      - name: Publish exact qualified release once
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/main | cut -f1)"
          version=$(cat VERSION)
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Public release $tag exists; refusing mutation." >&2
            exit 1
          fi
          gh release create "$tag" dist/*.deb dist/*.run \
            --target "$GITHUB_SHA" --title "Filesystem FAT16 ${version}" \
            --notes "Independent FAT16 filesystem SO, QEMU-tested Linux 6.12.107 KO reference, and OVMF-tested EFI driver. Kernel KO is version-specific and is not automatically loaded. GitHub generates source ZIP and tar.gz from this tag."
