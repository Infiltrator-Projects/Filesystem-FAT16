# SPDX-License-Identifier: GPL-3.0-or-later
# The old triple-driver packaging PR #3 predates the project's one-SO architecture.
# Preserve exact original tip in a tag; do not incorporate these obsolete files.
name: Archive superseded FAT16 PR3 branch
on:
  push:
    paths:
      - '.github/workflows/archive-superseded-triple-driver-pr3-20261101.yml'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: read
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Verify closed PR and preserve original history before pruning
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          branch="feature/full-fat16-so-ko-efi-20261028"
          expected="bc79b8899476d445cfd26eb74e00048e3f4dc48b"
          tag="archive/2026-11-01/superseded/fat16-triple-driver-pr3-${expected:0:12}"
          status=$(gh api "repos/$GH_REPO/pulls/3" --jq '.state')
          [[ "$status" == "closed" ]] || { echo "PR is open; do not prune"; exit 1; }
          open_heads=$(gh api --paginate "repos/$GH_REPO/pulls?state=open&per_page=100" --jq '.[].head.ref')
          if grep -Fxq -- "$branch" <<<"$open_heads"; then
            echo "Open PR still uses branch; do not prune"
            exit 0
          fi
          actual_head=$(gh api "repos/$GH_REPO/git/ref/heads/$branch" --jq '.object.sha' 2>/dev/null) || {
            echo "Branch already absent; nothing to do"
            exit 0
          }
          [[ "$actual_head" == "$expected" ]] || { echo "Branch changed; do not prune"; exit 1; }
          archived=$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null) || archived=""
          if [[ -z "$archived" ]]; then
            gh api -X POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$expected" >/dev/null
            archived=$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object.sha')
          fi
          [[ "$archived" == "$expected" ]] || { echo "Tag mismatch; keep branch"; exit 1; }
          latest=$(gh api "repos/$GH_REPO/git/ref/heads/$branch" --jq '.object.sha')
          [[ "$latest" == "$expected" ]] || { echo "Branch changed after archive; keep it"; exit 1; }
          gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$branch"
          echo "Archived original FAT16 PR #3 at refs/tags/$tag"
